name: Imitation validation
on:
  push:
    branches: [feature/mohdm6-imitation]
  pull_request:
    paths: ['code/fgame/**', 'tools/imitation/**', '.github/workflows/imitation-validation.yml']
permissions:
  contents: read
concurrency:
  group: imitation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native and data tests
        run: |
          python -m pip install 'numpy>=1.24,<3'
          cmake -S tools/imitation -B build-imitation-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-imitation-tests --parallel 2
          ctest --test-dir build-imitation-tests --output-on-failure
      - name: Core sanitizers
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Icode/fgame tools/imitation/test_policy.cpp code/fgame/imitation_policy.cpp -o build-imitation-tests/imitation_sanitized
          ./build-imitation-tests/imitation_sanitized
      - name: Engine dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build flex bison libsdl2-dev libopenal-dev libcurl4-openssl-dev
      - name: Dedicated server and game module
        run: |
          cmake -S . -B build-imitation -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_CLIENT=OFF -DBUILD_RENDERER_GL1=OFF -DBUILD_RENDERER_GL2=OFF -DBUILD_GAME_QVMS=OFF
          cmake --build build-imitation --parallel 2
          ctest --test-dir build-imitation --output-on-failure

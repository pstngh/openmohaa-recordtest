name: Imitation validation
on:
  push:
    branches: [feature/mohdm6-imitation]
  pull_request:
    paths: ['code/fgame/**', 'tools/imitation/**', '.github/workflows/imitation-validation.yml']
permissions:
  contents: write
concurrency:
  group: imitation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply pending narrow native hook
        run: |
          if [ -f tools/imitation/native-hook.patch ]; then
            git apply --check tools/imitation/native-hook.patch
            git apply tools/imitation/native-hook.patch
          fi
      - name: Native and data tests
        run: |
          python -m pip install 'numpy>=1.24,<3'
          cmake -S tools/imitation -B build-imitation-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-imitation-tests --parallel 2
          ctest --test-dir build-imitation-tests --output-on-failure
      - name: Engine dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build flex bison libsdl2-dev libopenal-dev libcurl4-openssl-dev
      - name: Dedicated server and game module
        run: |
          cmake -S . -B build-imitation -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_CLIENT=OFF -DBUILD_RENDERER_GL1=OFF -DBUILD_RENDERER_GL2=OFF -DBUILD_GAME_QVMS=OFF
          cmake --build build-imitation --parallel 2
          ctest --test-dir build-imitation --output-on-failure
      - name: Store compiled native hook without moving a branch
        if: github.repository == 'pstngh/openmohaa-recordtest' && github.ref == 'refs/heads/feature/mohdm6-imitation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          patch=pathlib.Path('tools/imitation/native-hook.patch')
          if not patch.exists():
              raise SystemExit(0)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['code/fgame/playerbot.cpp']
          content=pathlib.Path('code/fgame/playerbot.cpp').read_bytes()
          expected=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
          assert expected=='f65a93dfa8aa63e56700835d3f5b83dbaf2bd91c'
          payload=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode()
          request=urllib.request.Request('https://api.github.com/repos/pstngh/openmohaa-recordtest/git/blobs',data=payload,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
          assert result['sha']==expected
          pathlib.Path('native-hook.json').write_text(json.dumps({'base':os.environ['GITHUB_SHA'],'sha':expected,'path':'code/fgame/playerbot.cpp'}))
          print('VALIDATED_NATIVE_HOOK='+expected)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: imitation-native-hook
          path: native-hook.json
          if-no-files-found: ignore
          retention-days: 7

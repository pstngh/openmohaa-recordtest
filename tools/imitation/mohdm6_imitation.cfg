// EXPERIMENTAL: use the native-imitation build, not the old replay executable.
set g_gametype 1
set sv_sharedbots 0
set sv_maxclients 2
set sv_maxbots 8
set sv_numbots 1
set sv_minPlayers 0
set sv_fps 50
set g_replay_bots 0
set g_imitation_bots 1
set g_imitation_model "bots/imitation/mohdm6.omim"
set g_imitation_sampling 1
set g_imitation_seed 1
set g_imitation_actions 1
set g_imitation_reaction_ms 0
set g_imitation_debug 1
map dm/mohdm6
